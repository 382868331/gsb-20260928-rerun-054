[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-contract-valuation"
version = "0.1.0"
description = "Fixed-rate financial contract cash-flow generation and valuation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["financial_contracts*"]
